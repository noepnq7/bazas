<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las Bazas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f4a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a24;--mut:#6b756f;--acc:#1f6f4a;--ok:#1f6f4a;--bad:#b3392f;--line:#e2ded2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1c2b23;--ink:#eef2ee;--mut:#9aa8a0;--acc:#4cc38a;--ok:#4cc38a;--bad:#ff7b6e;--line:#2c3f34}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1c2b23;--ink:#eef2ee;--mut:#9aa8a0;--acc:#4cc38a;--ok:#4cc38a;--bad:#ff7b6e;--line:#2c3f34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .6em}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
input[type=number]{width:64px;text-align:center}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input[type=text]{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;display:flex;gap:6px;align-items:center}
.chip button{padding:0 8px;background:transparent;color:var(--mut);font-size:1.1rem}
.cfg{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin-top:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.tot td{font-weight:700;font-size:1.1rem;border-bottom:0}
.lead{color:var(--acc)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.step button{width:52px;height:52px;font-size:1.6rem;padding:0;border-radius:12px}
.step input{width:72px;height:52px;font-size:1.5rem;font-weight:700;text-align:center}
.pn{font-weight:700;margin-bottom:6px}.pr{display:flex;gap:16px}.pr>div{flex:1}
.step.sm{gap:4px;flex-wrap:nowrap}.step.sm button{width:44px;height:44px;font-size:1.4rem}.step.sm input{width:100%;min-width:0;max-width:56px;height:44px;font-size:1.3rem}
small,.mut{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>🃏 Las Bazas</h1>
<div id="app"></div>
</main>
<script>
const KEY="bazas-state-v2";
let S={players:[],rounds:[],cfg:{base:10,miss:3},started:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
let showT=false;
const maxT=()=>Math.floor(51/S.players.length);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pts=(b,w)=>b===w?S.cfg.base+b*b:-S.cfg.miss*Math.abs(b-w);
const totals=()=>S.players.map((_,i)=>S.rounds.reduce((a,r)=>a+pts(r.b[i],r.w[i]),0)-(S.pens||[]).filter(p=>p.i===i).reduce((a,p)=>a+p.n,0));

function render(){
  const app=document.getElementById("app");
  app.innerHTML=S.started?game():setup();
}
function setup(){
  return `<div class="card"><h2>Jugadores</h2>${S.players.length>1?`<small>Con ${S.players.length} jugadores: máximo ${maxT()} bazas por ronda (mazo de 52, siempre queda al menos una carta en el medio).</small>`:''}
  <div class="row"><input type="text" id="np" placeholder="Nombre" maxlength="20" onkeydown="if(event.key==='Enter')addP()"><button onclick="addP()">Agregar</button></div>
  <div class="chips">${S.players.map((p,i)=>`<span class="chip">${esc(p)}<button onclick="delP(${i})" aria-label="Quitar">×</button></span>`).join("")}</div></div>
  <div class="card"><h2>Puntaje</h2>
  <small>Si acierta: base + bazas pedidas al cuadrado (1→11, 2→14, 3→19…). Si falla: resta 3 por cada baza de diferencia (mínimo -3).</small>
  <div class="cfg">
  <label for="c1">Base por acertar</label><input type="number" id="c1" value="${S.cfg.base}" onchange="cfg()">
  
  <label for="c3">Penalidad por baza de diferencia</label><input type="number" id="c3" value="${S.cfg.miss}" onchange="cfg()">
  </div></div>
  <button onclick="start()" ${S.players.length<2?"disabled style='opacity:.5'":""}>Empezar partida</button> <button class="ghost" onclick="showH=!showH;render()">${showH?'Ocultar':'Ver'} historial</button>${showH?hist():''}`;
}
function game(){
  if(S.over)return over();
  const t=totals(),max=Math.max(...t);
  const n=S.rounds.length+1;
  const dealer=S.players[(n-1)%S.players.length];
  return `<div class="card"><h2>Ronda ${n} <small>· reparte ${esc(dealer)}</small></h2>
  <div style="margin-bottom:12px"><div class="mut" style="margin-bottom:6px">Bazas en juego (máx. ${maxT()})</div><div class="row step"><button onclick="stepT(-1)" aria-label="Menos">−</button><input type="text" id="t" readonly value="${Math.min(S.t||1,maxT())}"><button onclick="stepT(1)" aria-label="Más">+</button></div></div>
  <div class="scroll"><table>
  ${S.players.map((p,i)=>`<tr><td><div class="pn">${esc(p)}</div><div class="pr"><div><div class="mut">Pidió</div>${stp('b',i)}</div><div><div class="mut">Hizo</div>${stp('w',i)}</div></div></td></tr>`).join("")}
  </table></div>
  <div id="hint" class="bad" style="margin-top:10px;font-weight:600"></div>
  <div class="row" style="margin-top:12px"><button onclick="closeR()">Cerrar ronda</button>
  </div></div>
  <div class="card"><h2>Puntajes</h2><div class="scroll"><table>
  <tr><th>Ronda</th>${S.players.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>
  ${S.rounds.map((r,k)=>`<tr><td>${k+1}${r.t?' ('+r.t+')':''}</td>${S.players.map((_,i)=>{const hit=r.b[i]===r.w[i];return `<td class="${hit?"ok":"bad"}">${r.b[i]}/${r.w[i]} ${(()=>{const a=pts(r.b[i],r.w[i]),p=penOf(i,k+1),n=a-p;return `<b>${n>0?'+':''}${n}</b>`})()}</td>`}).join("")}</tr>`).join("")}
  ${penRow()}${showT?`<tr class="tot"><td>Total</td>${t.map(v=>`<td class="${S.rounds.length&&v===max?"lead":""}">${v}</td>`).join("")}</tr>`:''}
  </table></div><small>Cada celda: pidió/hizo y puntos de esa ronda.</small><div style="margin-top:10px"><button class="ghost" onclick="showT=!showT;render()">${showT?'Ocultar':'Mostrar'} totales</button></div></div>
  ${pensCard()}
  <div class="row" style="margin-top:40px;padding-top:16px;border-top:1px solid var(--line)"><button class="ghost" onclick="finish()" ${S.rounds.length?"":"disabled"}>Terminar partida</button><button class="ghost" onclick="reset()">Nueva partida</button></div>`;
}
function addP(){const e=document.getElementById("np"),v=e.value.trim();if(!v||S.players.length>=51)return;S.players.push(v);save();render();document.getElementById("np").focus();}
function delP(i){S.players.splice(i,1);save();render();}
function cfg(){S.cfg={base:+c1.value||0,miss:+c3.value||0};save();}
function start(){showT=false;S.started=true;S.pens=[];S.rounds=[];save();render();}
function closeR(){
  const b=[],w=[];
  for(let i=0;i<S.players.length;i++){
    const x=document.getElementById("b"+i).value,y=document.getElementById("w"+i).value;
    if(x===""||y==="")return alert("Completá lo que pidió y lo que hizo cada jugador.");
    b.push(+x);w.push(+y);
  }
  const t=+document.getElementById('t').value;
  if(!(t>=1)||t>maxT())return alert('Las bazas en juego tienen que ser entre 1 y '+maxT()+' (un solo mazo de 52 cartas, con al menos una en el medio).');
  const sb=b.reduce((a,v)=>a+v,0),sw=w.reduce((a,v)=>a+v,0);
  if(sb===t)return alert(`Los pedidos suman ${t}, igual que las bazas en juego. ${S.players[S.rounds.length%S.players.length]} (reparte) tiene que pedir otro número.`);
  if(sw!==t)return alert(`Las bazas ganadas suman ${sw} y tendrían que sumar ${t}.`);
  S.t=t;S.rounds.push({b,w,t});save();render();
}

let pSel=null,pAmt=3;
const penOf=(i,r)=>(S.pens||[]).filter(p=>p.i===i&&p.r===r).reduce((a,p)=>a+p.n,0);
function penRow(){const r=S.rounds.length+1;if(!(S.pens||[]).some(p=>p.r===r))return '';return `<tr><td>${r} <small>(en juego)</small></td>${S.players.map((_,i)=>{const n=penOf(i,r);return `<td class="bad">${n?'−'+n+' error':'·'}</td>`}).join('')}</tr>`;}
function keep(fn){const v={};document.querySelectorAll('.step input').forEach(e=>{if(e.id)v[e.id]=e.value});fn();Object.keys(v).forEach(id=>{const e=document.getElementById(id);if(e&&id!=='pamt')e.value=v[id]});hint();}
function selP(i){pSel=i;keep(render);}
function stepP(d){pAmt=Math.max(1,pAmt+d);keep(render);}
function addPen(){
  if(pSel===null)return say('Elegí a qué jugador penalizar.');
  const nm=S.players[pSel];
  (S.pens=S.pens||[]).push({i:pSel,n:pAmt,r:S.rounds.length+1});
  pSel=null;save();keep(render);say(nm+' pierde '+pAmt+' puntos.');
}
function delPen(k){S.pens.splice(k,1);save();keep(render);}
function pensCard(){
  const L=S.pens||[];
  return `<div class="card"><h2>Penalizar por error</h2><div class="chips" style="margin:0 0 12px">${S.players.map((p,i)=>`<button class="${pSel===i?'':'ghost'}" onclick="selP(${i})">${esc(p)}</button>`).join('')}</div><div class="row step"><button onclick="stepP(-1)" aria-label="Menos">−</button><input type="text" readonly id="pamt" value="${pAmt}"><button onclick="stepP(1)" aria-label="Más">+</button><button onclick="addPen()" style="flex:1;min-width:110px;width:auto">Restar puntos</button></div>${L.length?`<div style="margin-top:12px">${L.map((x,k)=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span>Ronda ${x.r} · ${esc(S.players[x.i]||'')} <b class="bad">−${x.n}</b></span><button class="ghost" onclick="delPen(${k})" aria-label="Quitar">×</button></div>`).join('')}</div>`:''}</div>`;
}
let showH=false;
function hist(){let h=[];try{h=JSON.parse(localStorage.getItem('bazas-hist')||'[]')}catch(e){}
  if(!h.length)return '<div class="card mut" style="margin-top:12px">Todavía no hay partidas guardadas.</div>';
  return h.map(g=>`<div class="card" style="margin-top:12px"><b>${new Date(g.date).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'})}</b> <small>· ${g.rounds.length} rondas</small><table>${g.players.map((p,i)=>`<tr><td>${esc(p)}</td><td><b>${g.totals[i]}</b></td></tr>`).join('')}</table></div>`).join('');}
let pend=null;
function say(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.3)';document.body.appendChild(e);}e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.display='none'},5000);}
window.alert=function(m){say(m)};
function ask(msg,fn){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20';
  o.innerHTML=`<div style="background:var(--card);color:var(--ink);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)"><p style="font-size:1.1rem;margin:0 0 18px">${msg}</p><div class="row" style="justify-content:center"><button class="ghost" id="no">Cancelar</button><button id="si">Confirmar</button></div></div>`;
  document.body.appendChild(o);
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelector('#no').onclick=()=>o.remove();
  o.querySelector('#si').onclick=()=>{o.remove();fn();};
}
function confirmar(k,msg){if(pend===k){pend=null;return true;}pend=k;say(msg+' Tocá de nuevo para confirmar.');setTimeout(()=>{if(pend===k)pend=null},5000);return false;}
function over(){
  const t=totals(),max=Math.max(...t);
  return `<div class="card"><h2>Partida terminada 🏆</h2><table>${S.players.map((p,i)=>`<tr><td>${esc(p)}</td><td class="${t[i]===max?'lead':''}"><b>${t[i]}</b></td></tr>`).join('')}</table><div id="status" class="mut" style="margin-top:10px">${S.saved?'✔ Partida guardada en este celular.':'Guardando…'}</div></div><button class="ghost" onclick="reset()">Nueva partida</button>`;
}
async function saveRec(){
  const st=document.getElementById('status');if(st)st.textContent='Guardando…';
  try{
    const hh=JSON.parse(localStorage.getItem('bazas-hist')||'[]');hh.unshift(S.rec);
    localStorage.setItem('bazas-hist',JSON.stringify(hh.slice(0,200)));
    S.saved=true;save();
    const a=document.getElementById('status');if(a)a.textContent='✔ Partida guardada en este celular.';
  }catch(e){
    const b=document.getElementById('status');if(b)b.innerHTML='No se pudo guardar. <button onclick="saveRec()">Reintentar</button>';
  }
}
function finish(){ask('¿Terminar la partida y guardarla?',doFinish);}
function doFinish(){
  S.over=true;S.saved=false;
  S.rec={date:new Date().toISOString(),players:S.players,rounds:S.rounds,cfg:S.cfg,pens:S.pens||[],totals:totals()};
  save();render();saveRec();
}
const stp=(k,i)=>`<div class="row step sm"><button onclick="stepV('${k}${i}',-1)" aria-label="Menos">−</button><input type="text" id="${k}${i}" readonly placeholder="–"><button onclick="stepV('${k}${i}',1)" aria-label="Más">+</button></div>`;
function stepV(id,d){const e=document.getElementById(id),m=+document.getElementById('t').value||1;e.value=e.value===''?0:Math.max(0,Math.min(m,+e.value+d));hint();}
function stepT(d){const e=document.getElementById('t');e.value=Math.max(1,Math.min(maxT(),(+e.value||1)+d));hint();}
function hint(){
  const h=document.getElementById('hint');if(!h)return;
  const t=+document.getElementById('t').value,di=S.rounds.length%S.players.length;let s=0,ok=true;
  S.players.forEach((_,i)=>{if(i===di)return;const v=document.getElementById('b'+i).value;if(v==='')ok=false;else s+=+v;});
  const f=t-s;
  h.textContent=(ok&&t>=1&&f>=0)?S.players[di]+' (reparte) no puede pedir '+f+'.':'';
}
function reset(){ask('¿Empezar una nueva partida?',()=>{S.started=false;S.over=false;S.pens=[];S.rounds=[];save();render();});}
render();
if(S.over&&!S.saved&&S.rec)saveRec();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
